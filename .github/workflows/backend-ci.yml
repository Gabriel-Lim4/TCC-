name: Backend CI

on:
  push:
    branches: [main]
    paths: ['eyesight-backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['eyesight-backend/**', '.github/workflows/backend-ci.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: eyesight-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eyesight-backend/package-lock.json
      - run: npm ci
      # O schema usa env(): valores falsos bastam para validar e gerar o client.
      - name: Validar schema do Prisma
        run: npx prisma validate && npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
      - name: Testes
        run: npm test

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eyesight-backend/package-lock.json
      - run: npm ci
      - name: Aplicar as migrações num banco vazio
        run: npx prisma migrate deploy
      - name: O banco deve ficar igual ao schema (nenhuma mudança sem migração)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
